<title>Lightbox Ray Viewer</title>

<style>
  /* Layout: a reading-room lightbox. Series rail beside the film on wide screens, a thumbnail strip above it on phones. Single dark look by choice. */
  :root{
    --ground:#0b0f14; --panel:#121820; --raised:#1a222c; --line:#26303c;
    --ink:#e4e9ef; --dim:#8794a3; --accent:#5fb3c8; --film:#ffcf6b; --measure:#7ee0a1;
    --ui:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;touch-action:manipulation}
  body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--ui);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
  header{display:flex;gap:8px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0 0 0 auto;letter-spacing:.01em}
  header h1 span{color:var(--dim);font-weight:400}
  button,.btn,select{background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;touch-action:manipulation;flex:none}
  button:hover,.btn:hover,select:hover{border-color:var(--accent)}
  button:focus-visible,.btn:focus-within,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button.on{background:color-mix(in srgb,var(--accent) 22%,var(--raised));border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  .primary{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:600}
  .primary:hover{border-color:var(--ink)}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  main{flex:1;display:flex;min-height:0}
  #list{width:290px;border-left:1px solid var(--line);overflow:auto;background:var(--panel);padding-block:4px}
  .study{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .study h3{margin:0 0 2px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.02em}
  .series{text-align:right;display:flex;align-items:center;gap:10px;padding:5px 6px}
  .series canvas{position:static;width:44px;height:44px;border-radius:4px;background:#000;flex:none}
  .series span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .series small{color:var(--dim);font-family:var(--mono);font-size:11px}
  #view{flex:1;display:flex;flex-direction:column;min-width:0}
  #tools{display:flex;gap:6px;padding-block:8px;padding-inline:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-items:center}
  #tools::-webkit-scrollbar{display:none}
  .sep{flex:none;width:1px;height:22px;background:var(--line);margin-inline:2px}
  #stage{flex:1;position:relative;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #cv{position:absolute;image-rendering:auto}
  #cv.px{image-rendering:pixelated}
  #ovc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ov{position:absolute;font:11px/1.45 var(--mono);color:var(--film);text-shadow:0 0 3px #000,0 0 1px #000;pointer-events:none;direction:ltr;max-width:62%;white-space:pre}
  #ovTL{top:8px;left:10px}#ovBL{bottom:8px;left:10px}#ovTR{top:8px;right:10px;text-align:right}
  .ori{position:absolute;font:600 13px var(--mono);color:var(--film);text-shadow:0 0 3px #000;pointer-events:none}
  #oriL{left:8px;top:50%;transform:translateY(-50%)}#oriR{right:8px;top:50%;transform:translateY(-50%)}
  #oriT{top:26px;left:50%;transform:translateX(-50%)}#oriB{bottom:8px;left:50%;transform:translateX(-50%)}
  #sample{position:absolute;bottom:8px;right:10px;font-size:12px;color:var(--ground);background:var(--film);border-radius:4px;padding:1px 8px}
  #toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;max-width:calc(100% - 32px);text-align:center;pointer-events:none;transition:opacity .4s}
  #info{position:absolute;top:10px;right:10px;left:auto;max-width:min(340px,calc(100% - 20px));background:color-mix(in srgb,var(--panel) 95%,transparent);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
  #info dt{color:var(--dim)}#info dd{margin:0;overflow-wrap:anywhere}
  #info .note{grid-column:1/-1;color:var(--dim);font-size:11px;margin-top:6px}
  #bar{display:flex;gap:10px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
  #bar button{padding:5px 10px}
  #pos{font:12px var(--mono);direction:ltr;min-width:64px;font-variant-numeric:tabular-nums;text-align:center}
  #slider{flex:1;min-width:0;direction:ltr;accent-color:var(--accent);height:28px}
  .hint{font-size:12px;color:var(--dim)}
  #status{font-size:12px;color:var(--dim)}
  #prog{height:2px;background:var(--accent);width:0;transition:width .15s}
  #drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:color-mix(in srgb,var(--ground) 70%,transparent)}
  .wide-only{display:inline-flex}
  body.focus header,body.focus #list,body.focus #prog{display:none}
  @media (max-width:760px){
    main{flex-direction:column}
    #list{width:auto;border-left:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden;padding:8px 12px;gap:10px;flex:none;scrollbar-width:none}
    #list::-webkit-scrollbar{display:none}
    .study{flex-direction:row;align-items:center;padding:0;border:0;gap:6px}
    .study h3{white-space:nowrap;margin:0;padding-inline-start:4px;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
    .series{flex:none;max-width:200px;padding:4px 6px}
    .series canvas{width:36px;height:36px}
    #barHint,.wide-only{display:none}
    header h1 span{display:none}
  }
  @media (hover:none){.wide-only{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>عارض الأشعة <span>· CT · سونار · رنين</span></h1>
  <label class="btn primary" for="anyInput">افتح ملف الأشعة</label>
  <input id="anyInput" type="file" multiple>
  <label class="btn wide-only" for="dirInput">افتح مجلد</label>
  <input id="dirInput" type="file" webkitdirectory multiple>
</header>
<div id="prog"></div>
<main>
  <nav id="list" aria-label="الفحوصات"></nav>
  <section id="view">
    <div id="tools" role="toolbar">
      <button data-tool="scroll">تقليب</button>
      <button data-tool="wl">تباين</button>
      <button data-tool="pan">تحريك</button>
      <button data-tool="measure">قياس</button>
      <span class="sep"></span>
      <select id="preset" aria-label="إعدادات التباين">
        <option value="">التباين: الأصلي</option>
        <option value="40,400">أنسجة</option>
        <option value="-600,1500">رئة</option>
        <option value="400,1800">عظم</option>
        <option value="40,80">دماغ</option>
        <option value="60,160">كبد</option>
        <option value="300,600">أوعية</option>
      </select>
      <button id="inv">عكس</button>
      <span class="sep"></span>
      <button id="zin" class="wide-only" aria-label="تكبير">+</button>
      <button id="zout" class="wide-only" aria-label="تصغير">−</button>
      <button id="fit">ملء</button>
      <button id="clearM" hidden>مسح القياس</button>
      <button id="infoBtn">معلومات</button>
      <button id="focusBtn">تركيز</button>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <canvas id="ovc"></canvas>
      <div class="ov" id="ovTL"></div><div class="ov" id="ovTR"></div><div class="ov" id="ovBL"></div>
      <div class="ori" id="oriL"></div><div class="ori" id="oriR"></div><div class="ori" id="oriT"></div><div class="ori" id="oriB"></div>
      <div id="sample">مثال تجريبي</div>
      <dl id="info" hidden></dl>
      <div id="toast" hidden></div>
      <div id="drop" hidden>أفلت الملف أو المجلد هنا</div>
    </div>
    <div id="bar">
      <button id="play" aria-label="تشغيل">▶</button>
      <span id="pos">– / –</span>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="رقم الصورة">
      <span class="hint" id="barHint">العجلة أو الأسهم للتقليب · ضغطتين للتكبير</span>
      <span id="status"></span>
    </div>
  </section>
</main>

<script>
"use strict";
document.documentElement.lang="ar"; document.documentElement.dir="rtl";
// ---------- DICOM parsing (uncompressed transfer syntaxes) ----------
const LONG_VR = new Set(["OB","OD","OF","OL","OV","OW","SQ","UC","UN","UR","UT","SV","UV"]);
const US_TAGS = {0x00280002:"spp",0x00280006:"planar",0x00280010:"rows",0x00280011:"cols",0x00280100:"bits",0x00280101:"stored",0x00280103:"signed"};
const STR_TAGS = {0x00080060:"modality",0x00080020:"studyDate",0x00081030:"studyDesc",0x0008103E:"seriesDesc",0x00080080:"institution",
  0x00100010:"patient",0x00100030:"birth",0x00100040:"sex",0x00101010:"age",0x00180050:"thickness",
  0x0020000D:"studyUID",0x0020000E:"seriesUID",0x00200011:"seriesNum",0x00200013:"instNum",0x00200032:"pos",0x00200037:"iop",
  0x00280004:"photo",0x00280008:"frames",0x00280030:"spacing",0x00281050:"wc",0x00281051:"ww",0x00281052:"intercept",0x00281053:"slope"};

function str(dv,off,len){let s="";for(let i=0;i<len;i++){const c=dv.getUint8(off+i);if(c)s+=String.fromCharCode(c)}return s.trim()}
function utf8(dv,off,len){try{return new TextDecoder().decode(new Uint8Array(dv.buffer,dv.byteOffset+off,len)).replace(/\0/g,"").trim()}catch{return str(dv,off,len)}}
function readHeader(dv,off,le,explicit){
  if(explicit){
    const vr=String.fromCharCode(dv.getUint8(off+4),dv.getUint8(off+5));
    if(LONG_VR.has(vr)) return {len:dv.getUint32(off+8,le),next:off+12};
    return {len:dv.getUint16(off+6,le),next:off+8};
  }
  return {len:dv.getUint32(off+4,le),next:off+8};
}
// Skips a sequence/item body of undefined length; returns the offset after its delimiter.
function skipUndefined(dv,off,le,explicit,endTag){
  while(off+8<=dv.byteLength){
    const g=dv.getUint16(off,le),tag=(g<<16|dv.getUint16(off+2,le))>>>0;
    if(g===0xFFFE){
      const len=dv.getUint32(off+4,le); off+=8;
      if(tag===endTag) return off;
      if(tag===0xFFFEE000) off = len===0xFFFFFFFF ? skipUndefined(dv,off,le,explicit,0xFFFEE00D) : off+len;
      continue;
    }
    const r=readHeader(dv,off,le,explicit); off=r.next;
    off = r.len===0xFFFFFFFF ? skipUndefined(dv,off,le,explicit,0xFFFEE0DD) : off+r.len;
  }
  throw new RangeError("truncated");
}
// Header fields + pixel offset; null when not DICOM; RangeError when the buffer is too short.
function parseDicom(buf){
  const dv=new DataView(buf);
  if(buf.byteLength<132||str(dv,128,4)!=="DICM") return null;
  const h={}; let off=132, le=true, explicit=true, ts="";
  while(off+8<=dv.byteLength&&dv.getUint16(off,true)===0x0002){
    const tag=(0x0002<<16|dv.getUint16(off+2,true))>>>0, r=readHeader(dv,off,true,true);
    if(tag===0x00020010) ts=str(dv,r.next,r.len);
    off=r.next+r.len;
  }
  if(ts==="1.2.840.10008.1.2") explicit=false;
  else if(ts==="1.2.840.10008.1.2.2") le=false;
  else if(ts&&ts!=="1.2.840.10008.1.2.1") h.compressed=ts;
  h.le=le;
  while(off+8<=dv.byteLength){
    const g=dv.getUint16(off,le),tag=(g<<16|dv.getUint16(off+2,le))>>>0, r=readHeader(dv,off,le,explicit);
    if(tag===0x7FE00010){h.pixelOffset=r.next;h.pixelLength=r.len;return h}
    if(r.len===0xFFFFFFFF){off=skipUndefined(dv,r.next,le,explicit,0xFFFEE0DD);continue}
    if(r.next+r.len>dv.byteLength) throw new RangeError("truncated");
    if(US_TAGS[tag]) h[US_TAGS[tag]]=dv.getUint16(r.next,le);
    else if(STR_TAGS[tag]) h[STR_TAGS[tag]]=tag===0x00100010||tag===0x00080080?utf8(dv,r.next,r.len):str(dv,r.next,r.len);
    off=r.next+r.len;
  }
  return h; // no pixel data (report, DICOMDIR...)
}

// ---------- Sources: plain files and entries inside .zip files ----------
function fileSource(file){
  return {name:file.name,size:file.size,read:(a,b)=>file.slice(a,b).arrayBuffer(),prefix:n=>file.slice(0,n).arrayBuffer()};
}
async function inflate(blob){return new Response(blob.stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()}
async function inflatePrefix(blob,n){
  const reader=blob.stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader(), parts=[]; let got=0;
  while(got<n){const {done,value}=await reader.read();if(done)break;parts.push(value);got+=value.length}
  reader.cancel().catch(()=>{});
  const out=new Uint8Array(Math.min(got,n));let o=0;
  for(const p of parts){const take=Math.min(p.length,out.length-o);out.set(p.subarray(0,take),o);o+=take;if(o>=out.length)break}
  return out.buffer;
}
async function zipSources(file){
  const u32=(dv,o)=>dv.getUint32(o,true), u16=(dv,o)=>dv.getUint16(o,true);
  const tailLen=Math.min(file.size,65557+20), tailStart=file.size-tailLen;
  const tail=new DataView(await file.slice(tailStart).arrayBuffer());
  let e=-1; for(let i=tail.byteLength-22;i>=0;i--) if(u32(tail,i)===0x06054b50){e=i;break}
  if(e<0) throw new Error("ليس ملف zip صالح");
  let count=u16(tail,e+10), cdSize=u32(tail,e+12), cdOff=u32(tail,e+16);
  if((count===0xFFFF||cdOff===0xFFFFFFFF)&&e>=20&&u32(tail,e-20)===0x07064b50){
    const z64=Number(tail.getBigUint64(e-20+8,true)), d=new DataView(await file.slice(z64,z64+56).arrayBuffer());
    count=Number(d.getBigUint64(32,true)); cdSize=Number(d.getBigUint64(40,true)); cdOff=Number(d.getBigUint64(48,true));
  }
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()), out=[], dec=new TextDecoder();
  for(let p=0,i=0;i<count&&p+46<=cd.byteLength;i++){
    if(u32(cd,p)!==0x02014b50) break;
    const flags=u16(cd,p+8), method=u16(cd,p+10), nLen=u16(cd,p+28), xLen=u16(cd,p+30), cLen=u16(cd,p+32);
    let comp=u32(cd,p+20), size=u32(cd,p+24), local=u32(cd,p+42);
    const name=dec.decode(new Uint8Array(cd.buffer,p+46,nLen));
    for(let x=p+46+nLen;x+4<=p+46+nLen+xLen;){ // zip64 extra field
      const id=u16(cd,x), len=u16(cd,x+2); let q=x+4;
      if(id===1){
        if(size===0xFFFFFFFF){size=Number(cd.getBigUint64(q,true));q+=8}
        if(comp===0xFFFFFFFF){comp=Number(cd.getBigUint64(q,true));q+=8}
        if(local===0xFFFFFFFF){local=Number(cd.getBigUint64(q,true))}
      }
      x+=4+len;
    }
    p+=46+nLen+xLen+cLen;
    const base=name.split("/").pop();
    if(name.endsWith("/")||name.startsWith("__MACOSX/")||base.startsWith("._")||(flags&1)||(method!==0&&method!==8)) continue;
    let dataBlob=null;
    const blob=async()=>{
      if(!dataBlob){const lh=new DataView(await file.slice(local,local+30).arrayBuffer());
        const start=local+30+u16(lh,26)+u16(lh,28); dataBlob=file.slice(start,start+comp)}
      return dataBlob;
    };
    if(method===0) out.push({name:base,size,read:async(a,b)=>(await blob()).slice(a,b).arrayBuffer(),prefix:async n=>(await blob()).slice(0,n).arrayBuffer()});
    else out.push({name:base,size,read:async(a,b)=>(await inflate(await blob())).slice(a,b),prefix:async n=>inflatePrefix(await blob(),n)});
  }
  return out;
}

// ---------- Index ----------
let studies=new Map(), skipped=0;
const $=id=>document.getElementById(id), prog=$("prog"), statusEl=$("status");

async function indexSource(src){
  if(src.size<132) return;
  let h;
  try{ h=parseDicom(await src.prefix(Math.min(src.size,131072))); }
  catch(e){ if(!(e instanceof RangeError)) return; try{ h=parseDicom(await src.read(0,src.size)); }catch{ return; } }
  if(!h||h.pixelOffset==null||!h.rows||!h.cols) return;
  if(h.compressed){skipped++;return}
  const frames=Math.max(1,parseInt(h.frames)||1), st=h.studyUID||"?", se=h.seriesUID||src.name;
  if(!studies.has(st)) studies.set(st,{date:h.studyDate||"",desc:h.studyDesc||"",h,series:new Map()});
  const S=studies.get(st);
  if(!S.series.has(se)) S.series.set(se,{num:parseInt(h.seriesNum)||0,desc:h.seriesDesc||"",modality:h.modality||"",study:S,items:[]});
  const z=h.pos?parseFloat(h.pos.split("\\")[2]):NaN;
  for(let f=0;f<frames;f++) S.series.get(se).items.push({src,h,frame:f,inst:parseInt(h.instNum)||0,z,name:src.name});
}
async function loadFiles(files){
  files=[...files]; if(!files.length) return;
  stopPlay(); statusEl.textContent="جاري فتح الملفات…";
  const sources=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)&&typeof DecompressionStream==="undefined"){
      statusEl.textContent="جهازك ما يدعم فتح ملفات zip. حدّث النظام (iOS 16.4 أو أحدث) أو افتح الصور بدون ضغط."; return;
    }
    if(/\.zip$/i.test(f.name)){
      try{ sources.push(...await zipSources(f)); }catch(err){ statusEl.textContent=`تعذّر فتح ${f.name}: ${err.message}`; return; }
    } else sources.push(fileSource(f));
  }
  studies=new Map(); cache.clear(); cacheBytes=0; current=null; skipped=0;
  let done=0; const queue=sources.slice();
  const worker=async()=>{while(queue.length){await indexSource(queue.shift());done++;
    if(done%10===0){prog.style.width=(100*done/sources.length)+"%";statusEl.textContent=`جاري القراءة ${done} / ${sources.length}`}}};
  await Promise.all(Array.from({length:6},worker));
  prog.style.width="0";
  let images=0;
  for(const S of studies.values()) for(const s of S.series.values()){
    s.items.sort((a,b)=>(a.inst-b.inst)||((a.z||0)-(b.z||0))||a.name.localeCompare(b.name)||(a.frame-b.frame));
    images+=s.items.length;
  }
  statusEl.textContent = studies.size ? `${images} صورة` : (skipped ? "الصور مضغوطة بصيغة غير مدعومة في هذا العارض." : "ما لقيت صور أشعة في الملفات المختارة.");
  if(studies.size){
    $("sample").hidden=true; buildList();
    toast(touch?"اسحب بإصبع للتقليب · إصبعين للتكبير · ضغطتين للتكبير والرجوع":"العجلة للتقليب · اسحب للتباين · Ctrl+العجلة للتكبير · ضغطتين للتكبير");
  }
}

function fmtDate(d){return d&&d.length===8?`${d.slice(6)}-${d.slice(4,6)}-${d.slice(0,4)}`:d}
const MOD_AR={CT:"أشعة مقطعية",US:"سونار",MR:"رنين مغناطيسي",CR:"أشعة سينية",DX:"أشعة سينية",XA:"قسطرة",MG:"ماموجرام",NM:"طب نووي",PT:"PET"};
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function buildList(){
  const list=$("list"); list.innerHTML=""; let first=null, n=0; const thumbs=[];
  for(const S of [...studies.values()].sort((a,b)=>a.date.localeCompare(b.date))){

      b.onclick=()=>{document.querySelectorAll(".series").forEach(x=>x.classList.remove("on"));b.classList.add("on");b.scrollIntoView({block:"nearest",inline:"nearest"});openSeries(s)};

// ---------- Pixels ----------
const cache=new Map(), touch=matchMedia("(hover:none)").matches, CACHE_BYTES=touch?120e6:400e6;
let cacheBytes=0;
async function getPixels(it){
  if(cache.has(it)) return cache.get(it);
  let px;
  if(it.gen) px=it.gen();
  else{
    const h=it.h, spp=h.spp||1, bytes=(h.bits||16)/8, n=h.rows*h.cols*spp, start=h.pixelOffset+it.frame*n*bytes;
    const buf=await it.src.read(start,start+n*bytes);
    if(spp===1){
      const dv=new DataView(buf), out=new Float32Array(h.rows*h.cols);
      const slope=parseFloat(h.slope)||1, icpt=parseFloat(h.intercept)||0, signed=h.signed===1, le=h.le;
      if(bytes===2){for(let i=0;i<out.length;i++)out[i]=(signed?dv.getInt16(i*2,le):dv.getUint16(i*2,le))*slope+icpt}
      else{for(let i=0;i<out.length;i++)out[i]=(signed?dv.getInt8(i):dv.getUint8(i))*slope+icpt}
      px={gray:out};
    }else px={rgb:new Uint8Array(buf)};
  }
  if(px.gray&&px.min==null){let mn=Infinity,mx=-Infinity;for(let i=0;i<px.gray.length;i+=7){const v=px.gray[i];if(v<mn)mn=v;if(v>mx)mx=v}px.min=mn;px.max=mx}
  cache.set(it,px); cacheBytes+=(px.gray||px.rgb).byteLength;
  for(const [k,v] of cache){if(cacheBytes<=CACHE_BYTES)break;if(k===current?.items[idx])continue;cache.delete(k);cacheBytes-=(v.gray||v.rgb).byteLength}
  return px;
}
function defaultWL(it,px){
  const c=parseFloat((it.h.wc||"").split("\\")[0]), w=parseFloat((it.h.ww||"").split("\\")[0]);
  if(isFinite(c)&&isFinite(w)&&w>1) return [c,w];
  return [(px.min+px.max)/2,Math.max(1,px.max-px.min)];
}
// Paints pixels into an ImageData with the given window; used by the main view and thumbnails.
function paint(it,px,img,c,w,inv){
  const h=it.h, d=img.data, W=h.cols, H=h.rows, mono1=(h.photo||"").startsWith("MONOCHROME1")!==inv;
  if(px.gray){
    const lo=c-w/2, k=255/w, g=px.gray;
    for(let i=0,j=0;i<g.length;i++,j+=4){let v=(g[i]-lo)*k;v=v<0?0:v>255?255:v;if(mono1)v=255-v;d[j]=d[j+1]=d[j+2]=v;d[j+3]=255}
  }else{
    const r=px.rgb, planar=h.planar===1, n=W*H, ybr=(h.photo||"").startsWith("YBR");
    for(let i=0,j=0;i<n;i++,j+=4){
      let a,b,cc; if(planar){a=r[i];b=r[i+n];cc=r[i+2*n]}else{a=r[i*3];b=r[i*3+1];cc=r[i*3+2]}
      if(ybr){const y=a,cb=b-128,cr=cc-128;a=y+1.402*cr;b=y-0.344136*cb-0.714136*cr;cc=y+1.772*cb}
      if(inv){a=255-a;b=255-b;cc=255-cc}
      d[j]=a;d[j+1]=b;d[j+2]=cc;d[j+3]=255;
    }
  }
}
async function drawThumb(s,c){
  const it=s.items[Math.floor(s.items.length/2)], px=await getPixels(it), [tc,tw]=defaultWL(it,px);
  const tmp=document.createElement("canvas"); tmp.width=it.h.cols; tmp.height=it.h.rows;
  const t=tmp.getContext("2d"), img=t.createImageData(tmp.width,tmp.height); paint(it,px,img,tc,tw,false); t.putImageData(img,0,0);
  const g=c.getContext("2d"), k=Math.min(c.width/tmp.width,c.height/tmp.height), w=tmp.width*k, h=tmp.height*k;
  g.fillStyle="#000"; g.fillRect(0,0,c.width,c.height); g.drawImage(tmp,(c.width-w)/2,(c.height-h)/2,w,h);
}

// ---------- Viewer ----------
const cv=$("cv"), ctx=cv.getContext("2d"), ovc=$("ovc"), octx=ovc.getContext("2d"), stage=$("stage"), slider=$("slider");
let current=null, idx=0, wc=40, ww=400, invert=false, zoom=0, panX=0, panY=0, tool=touch?"scroll":"wl", token=0, img=null, curPx=null;
let playTimer=null;

async function openSeries(s){
  stopPlay(); current=s; idx=Math.floor(s.items.length/2); invert=false; $("inv").classList.remove("on"); $("preset").value="";
  slider.max=s.items.length-1; slider.disabled=s.items.length<2; $("play").disabled=s.items.length<2;
  const it=s.items[idx];
  try{ [wc,ww]=defaultWL(it,await getPixels(it)); }catch{ statusEl.textContent="تعذّرت قراءة هذه المجموعة."; return; }
  zoom=0; panX=panY=0; renderInfo(); await show();
}
async function show(){
  if(!current) return;
  const my=++token, it=current.items[idx];
  let px;
  try{ px=await getPixels(it); }catch(err){ if(my===token) statusEl.textContent="تعذّرت قراءة هذه الصورة."; return; }
  if(my!==token) return;
  const h=it.h, W=h.cols, H=h.rows;
  if(!img||img.width!==W||img.height!==H) img=new ImageData(W,H);
  paint(it,px,img,wc,ww,invert); curPx=px;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  ctx.putImageData(img,0,0); place();
  slider.value=idx;
  $("pos").textContent=`${idx+1} / ${current.items.length}`;
  const zmm=isFinite(it.z)?`Z ${it.z.toFixed(1)} mm`:"", th=h.thickness?`  ${parseFloat(h.thickness)} mm`:"";
  $("ovTL").textContent=`${current.modality} · ${current.desc}\n${zmm}${th}`;
  wlText();
  orientation(h);
  prefetch();
}
function wlText(extra){ $("ovBL").textContent=(curPx&&curPx.gray?`W ${Math.round(ww)}  L ${Math.round(wc)}`:"")+(extra?"\n"+extra:""); }
function prefetch(){
  if(!current) return; const n=current.items.length;
  for(const d of [1,-1,2,-2,3]){const j=idx+d;if(j>=0&&j<n&&!cache.has(current.items[j]))getPixels(current.items[j]).catch(()=>{})}
}

// Orientation letters from ImageOrientationPatient: the patient direction each screen edge points to.
function dirLetter(x,y,z){
  const a=[[Math.abs(x),x>0?"L":"R"],[Math.abs(y),y>0?"P":"A"],[Math.abs(z),z>0?"S":"I"]].sort((p,q)=>q[0]-p[0]);
  return a[0][0]>0.5?a[0][1]:"";
}
function orientation(h){
  const v=(h.iop||"").split("\\").map(Number), ids=["oriL","oriR","oriT","oriB"];
  if(v.length!==6||v.some(x=>!isFinite(x))){ids.forEach(i=>$(i).textContent="");return}
  const [rx,ry,rz,cx,cy,cz]=v;
  $("oriR").textContent=dirLetter(rx,ry,rz); $("oriL").textContent=dirLetter(-rx,-ry,-rz);
  $("oriB").textContent=dirLetter(cx,cy,cz); $("oriT").textContent=dirLetter(-cx,-cy,-cz);
}

// ---------- Zoom & pan: 0 = fit; limits keep the image visible ----------
function fitZoom(){return Math.max(0.01,Math.min(stage.clientWidth/cv.width,stage.clientHeight/cv.height)*0.98)}
function effZoom(){return zoom>0?zoom:fitZoom()}
function clampPan(){
  const z=effZoom(), w=cv.width*z, h=cv.height*z, sw=stage.clientWidth, sh=stage.clientHeight;
  const mx=Math.max(0,(w+sw)/2-Math.min(80,w/2)), my=Math.max(0,(h+sh)/2-Math.min(80,h/2));
  panX=Math.max(-mx,Math.min(mx,panX)); panY=Math.max(-my,Math.min(my,panY));
}
// Zooms to z, keeping the image point under (ax, ay) (stage coordinates) fixed.
function setZoom(z,ax=stage.clientWidth/2,ay=stage.clientHeight/2){
  const f=fitZoom(), old=effZoom();
  z=Math.max(f*0.5,Math.min(Math.max(f*12,8),z));
  const left=(stage.clientWidth-cv.width*old)/2+panX, top=(stage.clientHeight-cv.height*old)/2+panY;
  const u=(ax-left)/old, v=(ay-top)/old;
  zoom=z; panX=ax-u*z-(stage.clientWidth-cv.width*z)/2; panY=ay-v*z-(stage.clientHeight-cv.height*z)/2;
  place();
}
function place(){
  if(!current) return;
  clampPan();
  const z=effZoom(), w=cv.width*z, h=cv.height*z;
  cv.style.width=w+"px"; cv.style.height=h+"px";
  cv.style.left=(stage.clientWidth-w)/2+panX+"px"; cv.style.top=(stage.clientHeight-h)/2+panY+"px";
  cv.classList.toggle("px",z>3);
  $("ovTR").textContent=`${cv.width}×${cv.height}  ${Math.round(z*100)}%`;
  drawOverlay();
}
function fit(){zoom=0;panX=panY=0;place()}
function toggleZoom(ax,ay){ if(effZoom()>fitZoom()*1.3) fit(); else setZoom(fitZoom()*2.5,ax,ay); }
function go(n){ if(!current) return; const v=Math.max(0,Math.min(current.items.length-1,n)); if(v!==idx){idx=v;show()} }
function setTool(t){tool=t;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x.dataset.tool===t))}

// ---------- Measurements (per image, in image pixels) ----------
function spacing(h){const s=(h.spacing||"").split("\\").map(parseFloat);return s.length===2&&s.every(x=>x>0)?s:null} // [row, column] mm
function toImage(sx,sy){const z=effZoom();return {x:(sx-parseFloat(cv.style.left))/z,y:(sy-parseFloat(cv.style.top))/z}}
function toStage(p){const z=effZoom();return {x:parseFloat(cv.style.left)+p.x*z,y:parseFloat(cv.style.top)+p.y*z}}
function measureLabel(it,m){
  const dx=m.b.x-m.a.x, dy=m.b.y-m.a.y, s=spacing(it.h);
  if(s){const mm=Math.hypot(dx*s[1],dy*s[0]);return mm>=10?`${(mm/10).toFixed(2)} cm`:`${mm.toFixed(1)} mm`}
  return `${Math.round(Math.hypot(dx,dy))} px`;
}
function drawOverlay(){
  const dpr=window.devicePixelRatio||1, W=stage.clientWidth, H=stage.clientHeight;
  if(ovc.width!==Math.round(W*dpr)||ovc.height!==Math.round(H*dpr)){ovc.width=Math.round(W*dpr);ovc.height=Math.round(H*dpr)}
  octx.setTransform(dpr,0,0,dpr,0,0); octx.clearRect(0,0,W,H);
  const it=current&&current.items[idx];
  $("clearM").hidden=!(current&&current.items.some(x=>x.measures&&x.measures.length));
  if(!it||!it.measures) return;
  const col=getComputedStyle(document.documentElement).getPropertyValue("--measure").trim()||"#7ee0a1";
  octx.lineWidth=2; octx.direction="ltr"; octx.textAlign="left"; octx.font="600 13px "+getComputedStyle(document.documentElement).getPropertyValue("--mono");
  for(const m of it.measures){
    const a=toStage(m.a), b=toStage(m.b);
    octx.strokeStyle=col; octx.fillStyle=col;
    octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y); octx.stroke();
    for(const p of [a,b]){octx.beginPath();octx.arc(p.x,p.y,4,0,7);octx.fill()}
    const t=measureLabel(it,m), tw=octx.measureText(t).width, lx=Math.min(W-tw-8,Math.max(4,b.x+8)), ly=Math.max(16,b.y-8);
    octx.fillStyle="rgba(0,0,0,.65)"; octx.fillRect(lx-4,ly-14,tw+8,19); octx.fillStyle=col; octx.fillText(t,lx,ly);
  }
}
function valueAt(sx,sy){
  if(!curPx||!current) return ""; const it=current.items[idx], p=toImage(sx,sy), x=Math.floor(p.x), y=Math.floor(p.y);
  if(x<0||y<0||x>=it.h.cols||y>=it.h.rows) return "";
  if(curPx.gray){const v=curPx.gray[y*it.h.cols+x];return current.modality==="CT"?`HU ${Math.round(v)}`:`${Math.round(v)}`}
  return "";
}

// ---------- Cine ----------
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null}$("play").textContent="▶";$("play").classList.remove("on")}
function togglePlay(){
  if(playTimer){stopPlay();return}
  if(!current||current.items.length<2) return;
  const fps=Math.min(15,Math.max(6,current.items.length/10));
  playTimer=setInterval(()=>{idx=(idx+1)%current.items.length;show()},1000/fps);
  $("play").textContent="⏸"; $("play").classList.add("on");
}

// ---------- Input ----------
const rel=e=>{const r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
let acc=0;
stage.addEventListener("wheel",e=>{
  e.preventDefault(); if(!current) return;
  const p=rel(e);
  if(e.ctrlKey||e.metaKey){setZoom(effZoom()*Math.exp(-Math.max(-60,Math.min(60,e.deltaY))*0.006),p.x,p.y);return}
  stopPlay();
  acc+=e.deltaY; const step=Math.abs(e.deltaY)>=50?Math.sign(acc):Math.trunc(acc/25);
  if(step){acc=0;go(idx+step)}
},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault()); // Safari page pinch
document.addEventListener("gesturechange",e=>e.preventDefault());

const pts=new Map(); let drag=null, pinch=null, lastTap={t:0,x:0,y:0};
stage.addEventListener("pointerdown",e=>{
  if(!current) return; try{stage.setPointerCapture(e.pointerId)}catch{}
  const p=rel(e); pts.set(e.pointerId,p);
  if(pts.size===2){
    const [a,b]=[...pts.values()]; drag=null; stopPlay();
    if(lastMeasure){const it=current.items[idx];it.measures.pop();lastMeasure=null;drawOverlay()} // second finger cancels a fresh measure
    pinch={d:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
  }else if(pts.size===1){
    const now=Date.now();
    if(e.pointerType==="touch"&&now-lastTap.t<300&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<40){toggleZoom(p.x,p.y);lastTap.t=0;return}
    lastTap={t:now,x:p.x,y:p.y};
    const t=e.button===2||e.shiftKey?"pan":tool;
    if(t!=="measure") stopPlay();
    drag={x:p.x,y:p.y,wc,ww,px:panX,py:panY,idx,t};
    if(t==="measure"){const it=current.items[idx],q=toImage(p.x,p.y);(it.measures||(it.measures=[])).push(lastMeasure={a:q,b:{...q}});drawOverlay()}
  }
});
let lastMeasure=null;
stage.addEventListener("pointermove",e=>{
  const p=rel(e);
  if(!pts.has(e.pointerId)){ if(e.pointerType==="mouse") wlText(valueAt(p.x,p.y)); return; }
  pts.set(e.pointerId,p);
  if(pinch&&pts.size>=2){
    const [a,b]=[...pts.values()], d=Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    panX+=mx-pinch.mx; panY+=my-pinch.my;
    setZoom(effZoom()*d/pinch.d,mx,my);
    pinch={d,mx,my}; return;
  }
  if(!drag) return; const dx=p.x-drag.x, dy=p.y-drag.y;
  if(drag.t==="pan"){panX=drag.px+dx;panY=drag.py+dy;place()}
  else if(drag.t==="scroll"){const step=Math.max(4,stage.clientHeight/Math.max(30,current.items.length));go(drag.idx+Math.round(dy/step))}
  else if(drag.t==="measure"&&lastMeasure){lastMeasure.b=toImage(p.x,p.y);drawOverlay()}
  else if(drag.t==="wl"&&curPx&&curPx.gray){ww=Math.max(1,drag.ww+dx*Math.max(1,drag.ww/200));wc=drag.wc+dy*Math.max(0.5,drag.ww/400);$("preset").value="";show()}
});
const lift=e=>{
  pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(!pts.size){
    if(lastMeasure){const m=lastMeasure,z=effZoom();if(Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y)*z<6){current.items[idx].measures.pop();drawOverlay()}}
    lastMeasure=null; drag=null;
  }
};
stage.addEventListener("pointerup",lift); stage.addEventListener("pointercancel",lift);
stage.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")wlText()});
stage.addEventListener("dblclick",e=>{const p=rel(e);toggleZoom(p.x,p.y)});
stage.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||(e.target.tagName==="INPUT"&&e.target.type!=="range")) return;
  const k=e.key;
  if(k==="ArrowUp"||k==="ArrowLeft"){e.preventDefault();stopPlay();go(idx-1)}
  else if(k==="ArrowDown"||k==="ArrowRight"){e.preventDefault();stopPlay();go(idx+1)}
  else if(k==="PageUp")go(idx-10); else if(k==="PageDown")go(idx+10);
  else if(k==="Home")go(0); else if(k==="End")go(1e9);
  else if(k===" "){e.preventDefault();togglePlay()}
  else if(k==="+"||k==="=")setZoom(effZoom()*1.25); else if(k==="-")setZoom(effZoom()/1.25);
  else if(k==="0"||k==="f")fit();
  else if(k==="Escape"){$("info").hidden=true;document.body.classList.remove("focus");$("focusBtn").classList.remove("on");place()}
});
slider.addEventListener("input",()=>{stopPlay();go(+slider.value)});
new ResizeObserver(()=>place()).observe(stage);

document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$("preset").onchange=async e=>{
  if(!current) return; const v=e.target.value, it=current.items[idx];
  if(v) [wc,ww]=v.split(",").map(Number); else [wc,ww]=defaultWL(it,await getPixels(it));
  show();
};
$("inv").onclick=e=>{invert=!invert;e.currentTarget.classList.toggle("on",invert);show()};
$("zin").onclick=()=>setZoom(effZoom()*1.25);
$("zout").onclick=()=>setZoom(effZoom()/1.25);
$("fit").onclick=fit;
$("play").onclick=togglePlay;
$("clearM").onclick=()=>{if(current)current.items.forEach(x=>delete x.measures);drawOverlay()};
$("focusBtn").onclick=e=>{const on=document.body.classList.toggle("focus");e.currentTarget.classList.toggle("on",on)};
$("infoBtn").onclick=e=>{const p=$("info");p.hidden=!p.hidden;e.currentTarget.classList.toggle("on",!p.hidden)};
$("anyInput").onchange=e=>{loadFiles(e.target.files);e.target.value=""};
$("dirInput").onchange=e=>{loadFiles(e.target.files);e.target.value=""};

function renderInfo(){
  const h=current.items[0].h, S=current.study, rows=[];
  const age=(h.age||"").match(/^0*(\d+)([YMWD])$/), unit={Y:"سنة",M:"شهر",W:"أسبوع",D:"يوم"};
  const add=(k,v)=>{if(v)rows.push(`<dt>${k}</dt><dd>${esc(v)}</dd>`)};
  add("المريض",(h.patient||"").replace(/\^+/g," ").trim());
  add("الجنس",{M:"ذكر",F:"أنثى"}[h.sex]||h.sex);
  add("العمر",age?`${age[1]} ${unit[age[2]]}`:h.age);
  add("الفحص",S&&S.desc); add("التاريخ",fmtDate(h.studyDate));
  add("المجموعة",`${current.desc} (${current.items.length} صورة)`);
  add("سماكة الشريحة",h.thickness?`${parseFloat(h.thickness)} mm`:"");
  add("المستشفى",h.institution);
  $("info").innerHTML=rows.join("")+'<div class="note">للعرض فقط. التشخيص من تقرير الطبيب.</div>';
}
let toastTimer=null;
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;el.style.opacity=1;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.style.opacity=0;setTimeout(()=>el.hidden=true,450)},4500)}

// drag & drop of files, zips and folders
const drop=$("drop");
document.addEventListener("dragover",e=>{e.preventDefault();drop.hidden=false});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)drop.hidden=true});
document.addEventListener("drop",async e=>{
  e.preventDefault(); drop.hidden=true;
  const out=[], walk=async entry=>{
    if(entry.isFile){out.push(await new Promise((res,rej)=>entry.file(res,rej)));return}
    const reader=entry.createReader(); let batch;
    do{batch=await new Promise((res,rej)=>reader.readEntries(res,rej));for(const c of batch)await walk(c)}while(batch.length);
  };
  const entries=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(entries.length){for(const en of entries)await walk(en);loadFiles(out)} else loadFiles(e.dataTransfer.files);
});

// ---------- Built-in sample: a synthetic head phantom (Shepp-Logan ellipsoids, in HU) ----------
function sampleSeries(){
  const N=256, SL=48, E=[ // [cx,cy,cz, rx,ry,rz, HU added]
    [0,0,0,.69,.92,.9,2000],[0,-.0184,0,.6624,.874,.88,-960],[.22,0,-.25,.11,.31,.22,-30],[-.22,0,-.25,.16,.41,.28,-30],

  const items=[];
  for(let s=0;s<SL;s++){
